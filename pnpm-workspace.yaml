packages:
  - apps/*
  - packages/*

# pnpm 11: packages allowed to run install scripts (native binaries / engine downloads).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  simple-git-hooks: true

# Flat node_modules: Electron packaging, Expo/Metro and Prisma are most reliable with a hoisted layout.
nodeLinker: hoisted

# One React for every surface (Expo SDK 54 requires 19.1.0); duplicates break hooks across packages.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  # S13: one patched fastify for the API and @nestjs/platform-fastify (security advisories < 5.12.5).
  fastify: 5.12.7
