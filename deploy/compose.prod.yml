# LabPass production stack (S14). Run from the repository root:
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build
# See docs/runbooks/deploy.md for first install, upgrades and rollback.
name: labpass

x-api-env: &api-env
  NODE_ENV: production
  LABPASS_DB_HOST: postgres
  LABPASS_DB_PORT: '5432'
  LABPASS_DB_NAME: ${LABPASS_DB_NAME:-labpass}
  LABPASS_DB_USER: ${LABPASS_DB_USER:-labpass}
  LABPASS_DB_PASSWORD: ${LABPASS_DB_PASSWORD:?set LABPASS_DB_PASSWORD in .env.prod}
  REDIS_URL: redis://redis:6379
  STORAGE_DIR: /data/storage
  DESFIRE_KEYS_FILE: /run/secrets/desfire_master_keys

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LABPASS_DB_NAME:-labpass}
      POSTGRES_USER: ${LABPASS_DB_USER:-labpass}
      POSTGRES_PASSWORD: ${LABPASS_DB_PASSWORD:?set LABPASS_DB_PASSWORD in .env.prod}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256m }
    logging: *logging

  # One-shot: applies pending Prisma migrations before the API starts (same slim image as the API).
  migrate:
    image: labpass/api:${LABPASS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    command: ['node', 'scripts/prisma.cjs', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    healthcheck:
      disable: true
    logging: *logging

  # Operator toolbox (full toolchain, ~3 GB, built only when used): seed, stock reconcile.
  #   docker compose ... --profile tools run --rm tools pnpm --filter @labpass/api db:seed
  tools:
    image: labpass/api-tools:${LABPASS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
      target: build
    profiles: ['tools']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    image: labpass/api:${LABPASS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      <<: *api-env
      WORKER_MODE: separate
    volumes:
      - storage:/data/storage
    secrets:
      - desfire_master_keys
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768m }
    logging: *logging

  worker:
    image: labpass/api:${LABPASS_VERSION:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file: .env.prod
    environment:
      <<: *api-env
      WORKER_MODE: separate
    volumes:
      - storage:/data/storage
    secrets:
      - desfire_master_keys
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging

  admin:
    image: labpass/admin:${LABPASS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
      args:
        LABPASS_API_ORIGIN: http://api:4000
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging

  web:
    image: labpass/web:${LABPASS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    environment:
      LABPASS_DOMAIN: ${LABPASS_DOMAIN:?set LABPASS_DOMAIN in .env.prod}
      LABPASS_ADMIN_DOMAIN: ${LABPASS_ADMIN_DOMAIN:?set LABPASS_ADMIN_DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./downloads:/srv/downloads:ro
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 256m }
    logging: *logging

  # Nightly encrypted backup of the database and stored files (docs/runbooks/backup-restore.md).
  backup:
    image: labpass/backup:${LABPASS_VERSION:-latest}
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${LABPASS_DB_NAME:-labpass}
      PGUSER: ${LABPASS_DB_USER:-labpass}
      PGPASSWORD: ${LABPASS_DB_PASSWORD:?set LABPASS_DB_PASSWORD in .env.prod}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env.prod}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
      TZ: ${TZ:-Africa/Douala}
    volumes:
      - storage:/data/storage:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  # Optional: `--profile monitoring`. Bound to localhost; reach it through an SSH tunnel (docs/runbooks/monitoring.md).
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uptime-kuma:/app/data
    logging: *logging

secrets:
  desfire_master_keys:
    file: ./secrets/desfire_master_keys

volumes:
  pg-data:
  redis-data:
  storage:
  caddy-data:
  caddy-config:
  uptime-kuma:
